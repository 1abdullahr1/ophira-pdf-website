<svg xmlns="http://www.w3.org/2000/svg" width="355" height="360" viewBox="18.97 29.23 355.08 359.81" role="img" aria-label="Folded-corner document app icon (indigo and sunny yellow)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Folded-corner document app icon (indigo and sunny yellow)</title>
  <defs>
    <!-- Paper silhouette: rounded square frame with square hole and a notch for the folded corner -->
    <path id="paper" d="M225.8,93.83 H130.13 A49,49 0 0 0 81.13,142.83 V278.95 A49,49 0 0 0 130.13,327.95 H260.24 A49,49 0 0 0 309.24,278.95 V185.5 H251.53 V271.85 H138.73 V151.3 H225.8 Z"/>
    <clipPath id="paperClip"><use href="#paper"/></clipPath>

    <!-- Soft crease shadow under the top bar (fades downward on the left bar) -->
    <linearGradient id="creaseTop" gradientUnits="userSpaceOnUse" x1="0" y1="151.3" x2="0" y2="195.3">
      <stop offset="0"    stop-color="#DAD6F0" stop-opacity="1"/>
      <stop offset="0.11" stop-color="#DAD6F0" stop-opacity="0.80"/>
      <stop offset="0.32" stop-color="#DAD6F0" stop-opacity="0.50"/>
      <stop offset="0.66" stop-color="#DAD6F0" stop-opacity="0.16"/>
      <stop offset="1"    stop-color="#DAD6F0" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft crease shadow beside the left bar (fades rightward on the bottom bar) -->
    <linearGradient id="creaseLeft" gradientUnits="userSpaceOnUse" x1="138.73" y1="0" x2="190.23" y2="0">
      <stop offset="0"    stop-color="#DAD6F0" stop-opacity="1"/>
      <stop offset="0.15" stop-color="#DAD6F0" stop-opacity="0.88"/>
      <stop offset="0.32" stop-color="#DAD6F0" stop-opacity="0.51"/>
      <stop offset="0.61" stop-color="#DAD6F0" stop-opacity="0.16"/>
      <stop offset="1"    stop-color="#DAD6F0" stop-opacity="0"/>
    </linearGradient>
    <!-- Tile gradient -->
    <linearGradient id="tileGrad" gradientUnits="userSpaceOnUse" x1="18.97" y1="29.23" x2="374.05" y2="389.04">
      <stop offset="0" stop-color="#3A34C4"/>
      <stop offset="1" stop-color="#8A4FFF"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="18.97" y="29.23" width="355.08" height="359.81" rx="80" ry="80" fill="url(#tileGrad)"/>

  <!-- Paper frame -->
  <use href="#paper" fill="#FBFAFF"/>
  <g clip-path="url(#paperClip)">
    <rect x="81.13"  y="151.3"  width="57.6" height="44"   fill="url(#creaseTop)"/>
    <rect x="138.73" y="271.85" width="51.5" height="56.2" fill="url(#creaseLeft)"/>
  </g>

  <!-- Folded corner -->
  <path d="M225.8,93.83 L309.24,185.5 H245.8 A20,20 0 0 1 225.8,165.5 Z" fill="#FFC93C"/>
</svg>
